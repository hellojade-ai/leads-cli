name: release

# Pushing a v* tag cuts the release. Nothing is published to a package
# registry — the artifacts attached here are the whole distribution.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build.sh stamps the version from git describe
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true

      - name: test before shipping
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: cross-compile
        run: VERSION=${GITHUB_REF_NAME} ./build.sh

      - name: verify the checksums we are about to publish
        run: cd dist && sha256sum --check SHA256SUMS

      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Binaries for linux, darwin and windows on amd64 and arm64, plus SHA256SUMS.

          Verify a download before running it:

              sha256sum --check --ignore-missing SHA256SUMS

          See the CHANGELOG for what is in this release." \
            dist/*
