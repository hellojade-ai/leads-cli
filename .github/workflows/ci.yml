name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: go ${{ matrix.go }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: gofmt
        if: runner.os != 'Windows'
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi

  build:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true
      - name: build every target
        run: ./build.sh
      # The binary must be able to describe itself without a network or a key.
      - name: smoke test the linux/amd64 binary
        run: |
          bin=$(ls dist/hellojade_*_linux_amd64)
          chmod +x "$bin"
          "$bin" version
          "$bin" help exit-codes > /dev/null
          "$bin" completion bash > /dev/null
          "$bin" leads submit --dry-run \
            --external-id 'ci-smoke:1' \
            --first-name Dana --last-name Whitfield --phone '6305550142'
          # A missing key is a usage error (exit 2), caught before any request.
          if "$bin" auth check; then echo "expected a non-zero exit"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: hellojade-binaries
          path: dist/
          retention-days: 7
